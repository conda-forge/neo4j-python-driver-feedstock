schema_version: 1

context:
  name: neo4j
  version: "6.3.0"

package:
  name: neo4j-python-driver
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/neo4j-${{ version }}.tar.gz
  sha256: d0d3986c37ad174a549a39dfec6d22a00a061ebcb0267f1a5caf856589838e73

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - setuptools ==82.0.1
    - pip
  run:
    - python >=${{ python_min }}
    - pytz

tests:
  - python:
      imports:
        - neo4j
        - neo4j.graph
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: Neo4j Bolt driver for Python
  license: Apache-2.0 AND Python-2.0
  license_file:
    - LICENSE.APACHE2.txt
    - LICENSE.PYTHON.txt
    - LICENSE.txt
    - NOTICE.txt
  homepage: https://github.com/neo4j/neo4j-python-driver

extra:
  recipe-maintainers:
    - pvanheus
    - thebestnom
    - xylar
